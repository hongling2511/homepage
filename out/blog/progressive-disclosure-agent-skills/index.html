__next_f.push([1,"\n# 渐进式披露：Claude Code 如何像智能图书管理员一样加载知识\n\n在使用 Claude 这样的高级 AI 时，最大的挑战并不是能力——而是**上下文管理**。每次与 AI 的交互都发生在\"上下文窗口\"中，你可以把它想象成一个小型工作台。这个工作台空间有限，所以只在上面放置当前任务所需的工具和文档至关重要。\n\nAnthropic 开发了一个巧妙的解决方案，叫做 **Agent Skills**，它基于一个名为**渐进式披露（Progressive Disclosure）**的设计原则。这个原则就像一个智能图书管理员，在恰当的时机为 Claude 提供恰当的信息——不多不少，刚刚好。\n\n```mermaid\nmindmap\n  root((渐进式披露))\n    问题\n      有限的上下文窗口\n      信息过载\n      效率权衡\n    解决方案\n      分层信息\n      动态加载\n      智能缓存\n    优势\n      无限知识\n      最大效率\n      专注执行\n```\n\n## 什么是 Agent Skills？\n\n**Agent Skill** 是一个有组织的文件夹，包含文本指令、可执行代码和其他资源，AI 智能体可以动态发现和加载这些资源，以更好地完成特定任务。智能体不再是\"万金油\"，而是可以通过技能成为特定领域的专家。\n\n```mermaid\nflowchart TB\n    subgraph Skill[\"Agent Skill 结构\"]\n        SM[SKILL.md\u003cbr/\u003e核心文件]\n        F1[forms.md]\n        F2[reference.md]\n        F3[scripts/]\n    end\n\n    SM --\u003e F1\n    SM --\u003e F2\n    SM --\u003e F3\n\n    Agent((Claude)) --\u003e|\"发现\"| SM\n```\n\n**Agent Skills 的主要目标：**\n\n| 目标 | 描述 |\n|------|------|\n| **专业化** | 将通用智能体转变为针对特定需求的专业智能体 |\n| **可组合性** | 将专业知识打包成可复用的资源，就像创建详细的入职指南 |\n\n每个技能都围绕一个名为 `SKILL.md` 的核心文件构建。智能体与这个文件及其相关资源的交互方式，是理解渐进式披露的关键。\n\n## 渐进式披露的三个层级\n\n渐进式披露的核心是一个简单但强大的理念：**分层揭示信息**，从简要概述到详细内容，只在必要时才展开。\n\n```mermaid\nflowchart LR\n    subgraph L1[\"第一层：目录\"]\n        Meta[名称 + 描述\u003cbr/\u003eYAML 元数据]\n    end\n\n    subgraph L2[\"第二层：正文\"]\n        Body[SKILL.md 主体\u003cbr/\u003e核心指令]\n    end\n\n    subgraph L3[\"第三层：附录\"]\n        Ref[附加文件\u003cbr/\u003e详细参考]\n    end\n\n    L1 --\u003e|\"如果相关\"| L2\n    L2 --\u003e|\"如果需要\"| L3\n\n    style L1 fill:#e3f2fd,stroke:#1976d2\n    style L2 fill:#fff3e0,stroke:#f57c00\n    style L3 fill:#e8f5e9,stroke:#388e3c\n```\n\n### 第一层：目录\n\nSKILL.md 的 YAML 头部只包含 `name` 和 `description` 元数据。这提供了**刚好足够的信息**，让 Claude 知道技能的存在和用途，而无需加载整个文件。\n\n```yaml\n# 示例：PDF 技能元数据\nname: \"PDF Skill\"\ndescription: \"操作 PDF 文档，填写表单，提取文本\"\n```\n\n**关键点：** 这些元数据在启动时预加载，就像图书馆目录一样。\n\n### 第二层：正文\n\n**只有当元数据表明技能与用户任务相关时**，Claude 才会读取 SKILL.md 文件的主体。这一层提供了技能的核心指令和工作流程。\n\n### 第三层及更深：附录\n\n技能目录中的附加链接文件（如 `forms.md`、`reference.md`）包含高度具体或冗长的信息。Claude **仅在需要时**才读取这些文件，用于非常具体的子任务。\n\n## 渐进式披露实战演示\n\n让我们通过一个实际例子来理解——一个设计用来操作 PDF 文档的\"PDF 技能\"。\n\n```mermaid\nsequenceDiagram\n    participant U as 用户\n    participant C as Claude\n    participant L1 as 第一层\u003cbr/\u003e元数据\n    participant L2 as 第二层\u003cbr/\u003eSKILL.md\n    participant L3 as 第三层\u003cbr/\u003eforms.md\n\n    Note over C,L1: 启动：元数据预加载\n\n    U-\u003e\u003eC: \"填写这个 PDF 表单\"\n\n    rect rgb(227, 242, 253)\n        Note over C,L1: 步骤 1：模式匹配\n        C-\u003e\u003eL1: 检查技能描述\n        L1--\u003e\u003eC: PDF 技能看起来相关\n    end\n\n    rect rgb(255, 243, 224)\n        Note over C,L2: 步骤 2：加载核心指令\n        C-\u003e\u003eL2: 读取 pdf/SKILL.md\n        L2--\u003e\u003eC: 核心 PDF 指令已加载\n    end\n\n    rect rgb(232, 245, 233)\n        Note over C,L3: 步骤 3：加载具体细节\n        C-\u003e\u003eL3: 读取 forms.md\n        L3--\u003e\u003eC: 表单填写详情已加载\n    end\n\n    C-\u003e\u003eU: 使用完整上下文执行任务\n```\n\n### 逐步分解\n\n| 步骤 | 操作 | 上下文窗口状态 |\n|------|------|----------------|\n| **启动** | 核心指令 + 第一层元数据加载 | 最小化，准备好处理任何任务 |\n| **技能触发** | 用户要求填写 PDF 表单 | 模式匹配到 PDF 技能 |\n| **第二层加载** | Claude 读取 SKILL.md 主体 | 添加核心指令 |\n| **第三层加载** | Claude 读取 forms.md | 添加专业知识 |\n| **执行** | Claude 执行任务 | 所有必要上下文就位 |\n\n## 为什么这很重要：核心优势\n\n渐进式披露提供了三个重大优势，改变了 AI 智能体的可能性边界。\n\n### 1. 解决上下文窗口限制\n\n```mermaid\nflowchart TB\n    subgraph Traditional[\"传统方法\"]\n        direction TB\n        A1[加载所有内容]\n        A2[上下文溢出]\n        A3[性能下降]\n        A1 --\u003e A2 --\u003e A3\n    end\n\n    subgraph Progressive[\"渐进式披露\"]\n        direction TB\n        B1[仅加载元数据]\n        B2[按需加载]\n        B3[无限潜力]\n        B1 --\u003e B2 --\u003e B3\n    end\n\n    style Traditional fill:#ffebee,stroke:#c62828\n    style Progressive fill:#e8f5e9,stroke:#2e7d32\n```\n\n通过仅在需要时加载信息，智能体不必一次性读取整个技能。这个优雅的解决方案意味着**技能中可以打包的上下文量实际上是无限的**。\n\n\u003e 开发者可以构建一整套组织知识库，智能体可以像人类一样在其中导航——一次查阅一个文档。\n\n### 2. 确保效率和可扩展性\n\n系统通过仅加载当前任务所需的内容，保持交互的精简和快速。\n\n| 指标 | 无渐进式披露 | 有渐进式披露 |\n|------|--------------|--------------|\n| 启动时间 | 慢（加载所有内容） | 快（仅元数据） |\n| 内存使用 | 高（所有技能加载） | 低（按需加载） |\n| 响应速度 | 下降 | 最优 |\n| 技能容量 | 有限 | 无限 |\n\n### 3. 结合自然语言与确定性代码\n\n技能可以包含预编写的脚本，Claude 可以作为工具执行。对于排序大型数据集或从 PDF 中提取表单字段等任务，传统代码比用语言模型生成解决方案更高效、更可靠。\n\n```mermaid\nflowchart LR\n    subgraph Agent[\"Claude 智能体\"]\n        NL[自然语言\u003cbr/\u003e推理与策略]\n        Code[确定性代码\u003cbr/\u003e精确操作]\n    end\n\n    Task((任务)) --\u003e NL\n    NL --\u003e|\"复杂推理\"| Decision\n    NL --\u003e|\"精确操作\"| Code\n    Code --\u003e Result((结果))\n    Decision --\u003e Result\n```\n\n**优势：**\n- 自然语言用于推理和策略\n- 确定性代码用于精确、可重复的操作\n- 一致性和成本节约\n\n## 实践实施建议\n\n在构建考虑渐进式披露的 Agent Skills 时：\n\n### 有效组织你的 SKILL.md\n\n```markdown\n# 良好的结构\n---\nname: \"My Skill\"\ndescription: \"简短、可搜索的描述\"\n---\n\n## 快速入门（第二层）\n适用于大多数用例的核心指令。\n\n## 另请参阅\n- [detailed-guide.md](./detailed-guide.md) - 复杂场景\n- [reference.md](./reference.md) - API 文档\n```\n\n### 保持元数据描述性但简洁\n\n第一层元数据应该是**可搜索且有区分度的**：\n\n| 好的描述 | 为什么有效 |\n|----------|------------|\n| \"填写 PDF 表单，提取文本，合并文档\" | 具体、可操作的关键词 |\n| \"处理 PDF 文件\" | 太模糊，可能无法正确触发 |\n\n### 逻辑组织附录\n\n```\nmy-skill/\n  SKILL.md           # 核心指令\n  forms.md           # 表单相关细节\n  extraction.md      # 文本提取细节\n  scripts/\n    fill_form.py     # 确定性代码\n    extract_text.py\n```\n\n## 总结\n\n渐进式披露是一种分层加载信息的智能系统——从简要摘要开始，进入核心指令，最后在需要时访问详细附录。\n\n```mermaid\nflowchart TB\n    subgraph Summary[\"渐进式披露原则\"]\n        P1[从元数据目录开始]\n        P2[相关时加载核心指令]\n        P3[仅在需要时访问细节]\n        P4[使用专注的上下文执行]\n\n        P1 --\u003e P2 --\u003e P3 --\u003e P4\n    end\n\n    style Summary fill:#f3e5f5,stroke:#7b1fa2\n```\n\n这种方法使 Claude 能够装备庞大的专业知识库，同时保持其活跃的\"工作台\"——上下文窗口——干净、有序、专注于手头的任务。\n\n**关键要点：**\n\n| 原则 | 优势 |\n|------|------|\n| 分层加载 | 无限技能容量 |\n| 按需访问 | 最大效率 |\n| 智能缓存 | 快速响应 |\n| 代码集成 | 可靠操作 |\n\n渐进式披露使 Agent Skills 能够同时具备深厚的专业知识和卓越的执行效率——这是 AI 智能体的最佳状态。\n\n---\n\n## 参考资料\n\n- [Claude Code Agent Skills 文档](https://docs.anthropic.com/en/docs/claude-code/skills) - Anthropic Docs\n- [Building effective agents](https://www.anthropic.com/research/building-effective-agents) - Anthropic Research\n\n---\n\n*准备好构建更智能的 AI 智能体了吗？开始思考渐进式披露——这是创建既博学又高效的智能体的关键。*\n"])</script><script>self.__next_f.push([1,"10:T2864,"])</script><script>self.__next_f.push([1,"\n# Progressive Disclosure: How Claude Code Loads Knowledge Like a Smart Librarian\n\nWhen working with advanced AI like Claude, one of the biggest challenges isn't capability—it's **context management**. Every interaction with an AI happens within a \"context window,\" which you can think of as a small workbench. This workbench has limited space, so placing only the necessary tools and documents on it for the current job is crucial.\n\nAnthropic developed a clever solution called **Agent Skills**, built on a design principle named **Progressive Disclosure**. This principle acts like a smart librarian, giving Claude exactly the information it needs, precisely when it needs it—never too much, never too little.\n\n```mermaid\nmindmap\n  root((Progressive Disclosure))\n    Problem\n      Limited Context Window\n      Information Overload\n      Efficiency Trade-offs\n    Solution\n      Layered Information\n      Dynamic Loading\n      Smart Caching\n    Benefits\n      Unlimited Knowledge\n      Maximum Efficiency\n      Focused Execution\n```\n\n## What Are Agent Skills?\n\nAn **Agent Skill** is an organized folder of textual instructions, executable code, and other resources that an AI agent can discover and load dynamically to perform better at specific tasks. Instead of being a jack-of-all-trades, an agent can use skills to become an expert in a particular area.\n\n```mermaid\nflowchart TB\n    subgraph Skill[\"Agent Skill Structure\"]\n        SM[SKILL.md\u003cbr/\u003eCentral File]\n        F1[forms.md]\n        F2[reference.md]\n        F3[scripts/]\n    end\n\n    SM --\u003e F1\n    SM --\u003e F2\n    SM --\u003e F3\n\n    Agent((Claude)) --\u003e|\"Discovers\"| SM\n```\n\n**Primary Goals of Agent Skills:**\n\n| Goal | Description |\n|------|-------------|\n| **Specialization** | Transform a general-purpose agent into a specialized one tailored to specific needs |\n| **Composability** | Package expertise into reusable resources, like creating a detailed onboarding guide |\n\nEvery skill is built around a central file called `SKILL.md`. The way an agent interacts with this file and its related resources is the key to understanding Progressive Disclosure.\n\n## The Three Levels of Progressive Disclosure\n\nAt its heart, Progressive Disclosure is a simple but powerful idea: **reveal information in layers**, from a brief overview to comprehensive detail, only as it becomes necessary.\n\n```mermaid\nflowchart LR\n    subgraph L1[\"Level 1: Table of Contents\"]\n        Meta[Name + Description\u003cbr/\u003eYAML Metadata]\n    end\n\n    subgraph L2[\"Level 2: Main Chapter\"]\n        Body[SKILL.md Body\u003cbr/\u003eCore Instructions]\n    end\n\n    subgraph L3[\"Level 3: Appendices\"]\n        Ref[Additional Files\u003cbr/\u003eDetailed References]\n    end\n\n    L1 --\u003e|\"If relevant\"| L2\n    L2 --\u003e|\"If needed\"| L3\n\n    style L1 fill:#e3f2fd,stroke:#1976d2\n    style L2 fill:#fff3e0,stroke:#f57c00\n    style L3 fill:#e8f5e9,stroke:#388e3c\n```\n\n### Level 1: The Table of Contents\n\nThe SKILL.md's YAML frontmatter contains just the `name` and `description` metadata. This provides **just enough information** for Claude to know the skill exists and what it's for, without loading the whole file.\n\n```yaml\n# Example: PDF Skill metadata\nname: \"PDF Skill\"\ndescription: \"Manipulate PDF documents, fill forms, extract text\"\n```\n\n**Key Point:** This metadata is pre-loaded at startup, acting like a library catalog.\n\n### Level 2: The Main Chapter\n\nClaude reads the main body of the SKILL.md file **only if the metadata suggests the skill is relevant** to the user's task. This level provides the core instructions and workflow for the skill.\n\n### Level 3 \u0026 Beyond: The Appendices\n\nAdditional linked files within the skill directory (e.g., `forms.md`, `reference.md`) contain highly specific or lengthy information. Claude reads these files **only on an as-needed basis** for very specific sub-tasks.\n\n## Progressive Disclosure in Action\n\nLet's walk through a practical example with a \"PDF Skill\" designed to give Claude abilities to manipulate PDF documents.\n\n```mermaid\nsequenceDiagram\n    participant U as User\n    participant C as Claude\n    participant L1 as Level 1\u003cbr/\u003eMetadata\n    participant L2 as Level 2\u003cbr/\u003eSKILL.md\n    participant L3 as Level 3\u003cbr/\u003eforms.md\n\n    Note over C,L1: Startup: Metadata pre-loaded\n\n    U-\u003e\u003eC: \"Fill out this PDF form\"\n\n    rect rgb(227, 242, 253)\n        Note over C,L1: Step 1: Pattern Match\n        C-\u003e\u003eL1: Check skill descriptions\n        L1--\u003e\u003eC: PDF Skill looks relevant\n    end\n\n    rect rgb(255, 243, 224)\n        Note over C,L2: Step 2: Load Core Instructions\n        C-\u003e\u003eL2: Read pdf/SKILL.md\n        L2--\u003e\u003eC: Core PDF instructions loaded\n    end\n\n    rect rgb(232, 245, 233)\n        Note over C,L3: Step 3: Load Specific Details\n        C-\u003e\u003eL3: Read forms.md\n        L3--\u003e\u003eC: Form-filling details loaded\n    end\n\n    C-\u003e\u003eU: Executes task with full context\n```\n\n### Step-by-Step Breakdown\n\n| Step | Action | Context Window State |\n|------|--------|---------------------|\n| **Startup** | Core instructions + Level 1 metadata loaded | Minimal, ready for any task |\n| **Skill Trigger** | User asks to fill PDF form | Pattern matched to PDF Skill |\n| **Level 2 Load** | Claude reads SKILL.md body | Core instructions added |\n| **Level 3 Load** | Claude reads forms.md | Specialized knowledge added |\n| **Execution** | Claude performs the task | All necessary context present |\n\n## Why This Matters: Key Benefits\n\nProgressive Disclosure provides three significant advantages that change what's possible with AI agents.\n\n### 1. Solves the Context Window Limit\n\n```mermaid\nflowchart TB\n    subgraph Traditional[\"Traditional Approach\"]\n        direction TB\n        A1[Load Everything]\n        A2[Context Overflow]\n        A3[Performance Loss]\n        A1 --\u003e A2 --\u003e A3\n    end\n\n    subgraph Progressive[\"Progressive Disclosure\"]\n        direction TB\n        B1[Load Metadata Only]\n        B2[Load as Needed]\n        B3[Unlimited Potential]\n        B1 --\u003e B2 --\u003e B3\n    end\n\n    style Traditional fill:#ffebee,stroke:#c62828\n    style Progressive fill:#e8f5e9,stroke:#2e7d32\n```\n\nBy loading information only as needed, agents don't have to read the entirety of a skill at once. This elegant solution means that **the amount of context that can be bundled into a skill is effectively unbounded**.\n\n\u003e Developers can build an entire library of organizational knowledge, and the agent can navigate it like a human would—one document at a time.\n\n### 2. Ensures Efficiency and Scalability\n\nThe system keeps interactions lean and fast by loading only what is necessary for the immediate task.\n\n| Metric | Without Progressive Disclosure | With Progressive Disclosure |\n|--------|-------------------------------|----------------------------|\n| Startup Time | Slow (load everything) | Fast (metadata only) |\n| Memory Usage | High (all skills loaded) | Low (on-demand loading) |\n| Response Speed | Degraded | Optimal |\n| Skill Capacity | Limited | Unlimited |\n\n### 3. Combines Natural Language with Deterministic Code\n\nSkills can include pre-written scripts that Claude can execute as tools. For tasks like sorting a large dataset or extracting form fields from a PDF, traditional code is far more efficient and reliable than generating a solution with a language model.\n\n```mermaid\nflowchart LR\n    subgraph Agent[\"Claude Agent\"]\n        NL[Natural Language\u003cbr/\u003eReasoning \u0026 Strategy]\n        Code[Deterministic Code\u003cbr/\u003ePrecise Operations]\n    end\n\n    Task((Task)) --\u003e NL\n    NL --\u003e|\"Complex reasoning\"| Decision\n    NL --\u003e|\"Precise operations\"| Code\n    Code --\u003e Result((Result))\n    Decision --\u003e Result\n```\n\n**Benefits:**\n- Natural language for reasoning and strategy\n- Deterministic code for precise, repeatable operations\n- Consistency and cost savings\n\n## Practical Implementation Tips\n\nWhen building Agent Skills with Progressive Disclosure in mind:\n\n### Structure Your SKILL.md Effectively\n\n```markdown\n# Good Structure\n---\nname: \"My Skill\"\ndescription: \"Brief, searchable description\"\n---\n\n## Quick Start (Level 2)\nCore instructions that apply to most use cases.\n\n## See Also\n- [detailed-guide.md](./detailed-guide.md) - For complex scenarios\n- [reference.md](./reference.md) - API documentation\n```\n\n### Keep Metadata Descriptive but Concise\n\nThe Level 1 metadata should be **searchable and distinctive**:\n\n| Good Description | Why It Works |\n|-----------------|--------------|\n| \"Fill PDF forms, extract text, merge documents\" | Specific, actionable keywords |\n| \"Handle PDF files\" | Too vague, might not trigger correctly |\n\n### Organize Appendices Logically\n\n```\nmy-skill/\n  SKILL.md           # Core instructions\n  forms.md           # Form-specific details\n  extraction.md      # Text extraction details\n  scripts/\n    fill_form.py     # Deterministic code\n    extract_text.py\n```\n\n## Conclusion\n\nProgressive Disclosure is a system of loading information in smart, incremental layers—starting with a brief summary, moving to core instructions, and finally accessing detailed appendices as needed.\n\n```mermaid\nflowchart TB\n    subgraph Summary[\"The Progressive Disclosure Principle\"]\n        P1[Start with metadata catalog]\n        P2[Load core instructions when relevant]\n        P3[Access details only when needed]\n        P4[Execute with focused context]\n\n        P1 --\u003e P2 --\u003e P3 --\u003e P4\n    end\n\n    style Summary fill:#f3e5f5,stroke:#7b1fa2\n```\n\nThis method allows Claude to be equipped with a vast library of specialized knowledge while keeping its active \"workbench\"—the context window—clean, organized, and focused on the task at hand.\n\n**Key Takeaways:**\n\n| Principle | Benefit |\n|-----------|---------|\n| Layered Loading | Unlimited skill capacity |\n| On-Demand Access | Maximum efficiency |\n| Smart Caching | Fast response times |\n| Code Integration | Reliable operations |\n\nProgressive Disclosure is what allows Agent Skills to be both incredibly deep in their expertise and remarkably efficient in their execution—the best of both worlds for AI agents.\n\n---\n\n## References\n\n- [Claude Code Agent Skills Documentation](https://docs.anthropic.com/en/docs/claude-code/skills) - Anthropic Docs\n- [Building effective agents](https://www.anthropic.com/research/building-effective-agents) - Anthropic Research\n\n---\n\n*Ready to build smarter AI agents? Start thinking about Progressive Disclosure—it's the key to creating agents that are both knowledgeable and efficient.*\n"])</script><script>self.__next_f.push([1,"5:[\"$\",\"$Le\",null,{\"posts\":{\"zh\":{\"slug\":\"progressive-disclosure-agent-skills\",\"locale\":\"zh\",\"frontmatter\":{\"title\":\"渐进式披露：Claude Code 如何像智能图书管理员一样加载知识\",\"date\":\"2026-01-05\",\"excerpt\":\"探索 Anthropic 的 Agent Skills 如何使用渐进式披露原则，在恰当的时机为 Claude 提供恰当的信息，让 AI 智能体既博学又高效。\",\"category\":\"tutorial\",\"tags\":[\"AI\",\"Claude\",\"Agent Skills\",\"渐进式披露\",\"上下文管理\"]},\"content\":\"$f\",\"readingTime\":3,\"wordCount\":592},\"en\":{\"slug\":\"progressive-disclosure-agent-skills\",\"locale\":\"en\",\"frontmatter\":{\"title\":\"Progressive Disclosure: How Claude Code Loads Knowledge Like a Smart Librarian\",\"date\":\"2026-01-05\",\"excerpt\":\"Discover how Anthropic's Agent Skills use Progressive Disclosure to give Clau
