utoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\"\n  allowFullScreen\n\u003e\u003c/iframe\u003e\n\u003c/div\u003e\n\n---\n\n## 核心架构\n\n\u003cdiv className=\"card-grid cols-3\"\u003e\n\n\u003cdiv className=\"study-card accent-blue\"\u003e\n\u003cdiv className=\"card-icon\"\u003e🔄\u003c/div\u003e\n\u003ch3\u003e智能体循环\u003c/h3\u003e\n\u003cdiv className=\"card-content\"\u003e\n\n**收集** → **执行** → **验证** → 循环\n\n- 收集：搜索、读取、子智能体\n- 执行：Bash、工具、代码生成\n- 验证：规则、视觉、LLM\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cdiv className=\"study-card accent-purple\"\u003e\n\u003cdiv className=\"card-icon\"\u003e🛠️\u003c/div\u003e\n\u003ch3\u003eBash = 超级工具\u003c/h3\u003e\n\u003cdiv className=\"card-content\"\u003e\n\n**\"第一代码模式\"**\n\n```bash\ntail -f log | grep ERROR\n```\n\n通用 + 可组合 + 动态脚本\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cdiv className=\"study-card accent-green\"\u003e\n\u003cdiv className=\"card-icon\"\u003e🔌\u003c/div\u003e\n\u003ch3\u003eMCP 协议\u003c/h3\u003e\n\u003cdiv className=\"card-content\"\u003e\n\n**标准化外部集成**\n\nAgent ⟷ MCP ⟷ Slack/GitHub/...\n\n即插即用，自动认证\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003c/div\u003e\n\n---\n\n## 关键组件\n\n\u003cdiv className=\"card-grid cols-2\"\u003e\n\n\u003cdiv className=\"study-card accent-orange\"\u003e\n\u003cdiv className=\"card-icon\"\u003e👥\u003c/div\u003e\n\u003ch3\u003e子智能体\u003c/h3\u003e\n\u003cdiv className=\"card-content\"\u003e\n\n| 优势 | 说明 |\n|:--:|:--|\n| ⚡ | 并行处理多任务 |\n| 📦 | 隔离上下文，返回摘要 |\n\n\u003e 像研究团队的初级成员\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cdiv className=\"study-card accent-teal\"\u003e\n\u003cdiv className=\"card-icon\"\u003e📝\u003c/div\u003e\n\u003ch3\u003e技能系统\u003c/h3\u003e\n\u003cdiv className=\"card-content\"\u003e\n\n| 本质 | 文件夹形式的指令集 |\n|:--:|:--|\n| 机制 | 渐进式上下文披露 |\n| 场景 | 前端设计、文档生成 |\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003c/div\u003e\n\n\u003cdiv className=\"card-grid cols-2\"\u003e\n\n\u003cdiv className=\"study-card accent-pink\"\u003e\n\u003cdiv className=\"card-icon\"\u003e🗜️\u003c/div\u003e\n\u003ch3\u003eCompact 压缩\u003c/h3\u003e\n\u003cdiv className=\"card-content\"\u003e\n\n**问题**：长对话耗尽上下文\n\n**方案**：自动总结历史消息\n\n监测 → 触发 → 摘要 → 继续\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cdiv className=\"study-card accent-indigo\"\u003e\n\u003cdiv className=\"card-icon\"\u003e💻\u003c/div\u003e\n\u003ch3\u003e代码生成\u003c/h3\u003e\n\u003cdiv className=\"card-content\"\u003e\n\n**为什么是核心能力？**\n\n✅ 精确可预测\n✅ 可组合复用\n✅ 处理复杂操作\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003c/div\u003e\n\n---\n\n## 安全模型\n\n\u003cdiv className=\"study-card wide accent-red\"\u003e\n\u003cdiv className=\"card-icon\"\u003e🧀\u003c/div\u003e\n\u003ch3\u003e瑞士奶酪防御\u003c/h3\u003e\n\u003cdiv className=\"card-content defense-layers\"\u003e\n\n```\n输入 → [模型对齐] → [工具权限] → [沙盒环境] → 安全输出\n         防恶意        解析控制       限制影响\n```\n\n**单层有漏洞，多层叠加确保安全**\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cdiv className=\"card-grid cols-3\"\u003e\n\n\u003cdiv className=\"study-card small accent-green\"\u003e\n\u003ch4\u003e规则检查\u003c/h4\u003e\n\u003cp\u003e⭐⭐⭐ 快 | 代码/结构数据\u003c/p\u003e\n\u003c/div\u003e\n\n\u003cdiv className=\"study-card small accent-yellow\"\u003e\n\u003ch4\u003e视觉反馈\u003c/h4\u003e\n\u003cp\u003e⭐⭐ 中 | UI/格式化\u003c/p\u003e\n\u003c/div\u003e\n\n\u003cdiv className=\"study-card small accent-orange\"\u003e\n\u003ch4\u003eLLM 评判\u003c/h4\u003e\n\u003cp\u003e⭐ 慢 | 主观质量\u003c/p\u003e\n\u003c/div\u003e\n\n\u003c/div\u003e\n\n---\n\n## 智能体 vs 工作流\n\n\u003cdiv className=\"comparison-table\"\u003e\n\n| | 🤖 智能体 | 📋 工作流 |\n|:--|:--|:--|\n| **输入** | 模糊自然语言 | 明确定义 |\n| **轨迹** | 自主决定 | 预设路径 |\n| **场景** | 探索性任务 | 流程化任务 |\n| **例子** | Claude Code | CI/CD |\n\n\u003c/div\u003e\n\n---\n\n## 术语速查\n\n\u003cdiv className=\"term-grid\"\u003e\n\n| 术语 | 一句话定义 |\n|:--|:--|\n| **智能搜索** | 用 grep/tail 主动搜索文件 |\n| **Hooks** | 运行时的确定性验证/插入 |\n| **Compact** | 自动总结防止上下文耗尽 |\n| **上下文工程** | 通过环境结构优化性能 |\n| **Tools** | 原子操作的定义 |\n\n\u003c/div\u003e\n\n---\n\n## 自测问答\n\n\u003cdetails\u003e\n\u003csummary\u003e❓ SDK 的核心设计原则？\u003c/summary\u003e\n\n通过终端让智能体访问计算机，使用人类相同的工具。\n\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e❓ 为什么 Bash 最强大？\u003c/summary\u003e\n\n通用 + 可组合 + 存储结果 + 动态脚本 + 复用现有软件\n\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e❓ 子智能体的两大优势？\u003c/summary\u003e\n\n1. 并行化处理\n2. 隔离上下文，只返回关键信息\n\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e❓ 三种验证方法的选择？\u003c/summary\u003e\n\n- 代码 → 规则检查（TypeScript/ESLint）\n- UI → 视觉反馈（截图）\n- 主观内容 → LLM 评判（谨慎）\n\n\u003c/details\u003e\n\n---\n\n\u003cdiv className=\"checklist\"\u003e\n\n## 学习进度\n\n- [ ] 智能体循环三阶段\n- [ ] Bash 的核心优势\n- [ ] 子智能体与上下文管理\n- [ ] MCP 协议作用\n- [ ] 瑞士奶酪防御模型\n- [ ] 验证方法选择\n\n\u003c/div\u003e\n\n\u003c/div\u003e\n\n\u003cstyle\u003e{`\n.video-container {\n  margin: 1.5rem 0;\n  border-radius: 12px;\n  overflow: hidden;\n  box-shadow: 0 4px 20px rgba(0,0,0,0.15);\n}\n\n.video-container iframe {\n  display: block;\n}\n\n.sdk-cards {\n  --card-radius: 12px;\n  --sdk-blue: #3b82f6;\n  --sdk-purple: #8b5cf6;\n  --sdk-green: #10b981;\n  --sdk-orange: #f59e0b;\n  --sdk-teal: #14b8a6;\n  --sdk-pink: #ec4899;\n  --sdk-indigo: #6366f1;\n  --sdk-red: #ef4444;\n  --sdk-yellow: #eab308;\n}\n\n.card-grid {\n  display: grid;\n  gap: 1rem;\n  margin: 1.5rem 0;\n}\n\n.card-grid.cols-2 {\n  grid-template-columns: repeat(2, 1fr);\n}\n\n.card-grid.cols-3 {\n  grid-template-columns: repeat(3, 1fr);\n}\n\n@media (max-width: 768px) {\n  .card-grid.cols-2,\n  .card-grid.cols-3 {\n    grid-template-columns: 1fr;\n  }\n}\n\n.study-card {\n  background: var(--card);\n  border-radius: var(--card-radius);\n  padding: 1.25rem;\n  border-left: 4px solid var(--sdk-accent, var(--sdk-blue));\n  box-shadow: 0 2px 8px rgba(0,0,0,0.08);\n  transition: transform 0.2s, box-shadow 0.2s;\n}\n\n.study-card:hover {\n  transform: translateY(-2px);\n  box-shadow: 0 4px 16px rgba(0,0,0,0.15);\n}\n\n.study-card.wide {\n  grid-column: 1 / -1;\n}\n\n.study-card.small {\n  padding: 0.75rem 1rem;\ ist h2 {\n  margin-top: 0;\n  color: var(--success) !important;\n}\n\n.checklist ul {\n  list-style: none;\n  padding: 0;\n  margin: 0;\n}\n\n.checklist li {\n  padding: 0.5rem 0;\n  border-bottom: 1px dashed var(--border);\n  color: var(--foreground) !important;\n}\n`}\u003c/style\u003e\n"])</script><script>self.__next_f.push([1,"10:T38ff,"])</script><script>self.__next_f.push([1,"\nimport { Card, CardGrid } from '@/components/Card';\n\n\u003cdiv className=\"sdk-cards\"\u003e\n\n\u003cdiv className=\"video-container\"\u003e\n\u003ciframe\n  width=\"100%\"\n  height=\"400\"\n  src=\"https://www.youtube.com/embed/TqC1qOfiVcQ\"\n  title=\"Claude Agent SDK\"\n  frameBorder=\"0\"\n  allow=\"accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture\"\n  allowFullScreen\n\u003e\u003c/iframe\u003e\n\u003c/div\u003e\n\n---\n\n## Core Architecture\n\n\u003cdiv className=\"card-grid cols-3\"\u003e\n\n\u003cdiv className=\"study-card accent-blue\"\u003e\n\u003cdiv className=\"card-icon\"\u003e🔄\u003c/div\u003e\n\u003ch3\u003eAgentic Loop\u003c/h3\u003e\n\u003cdiv className=\"card-content\"\u003e\n\n**Gather** → **Act** → **Verify** → Loop\n\n- Gather: Search, read, subagents\n- Act: Bash, tools, code generation\n- Verify: Rules, visual, LLM\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cdiv className=\"study-card accent-purple\"\u003e\n\u003cdiv className=\"card-icon\"\u003e🛠️\u003c/div\u003e\n\u003ch3\u003eBash = Super Tool\u003c/h3\u003e\n\u003cdiv className=\"card-content\"\u003e\n\n**\"First Code Mode\"**\n\n```bash\ntail -f log | grep ERROR\n```\n\nGeneral + Composable + Dynamic\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cdiv className=\"study-card accent-green\"\u003e\n\u003cdiv className=\"card-icon\"\u003e🔌\u003c/div\u003e\n\u003ch3\u003eMCP Protocol\u003c/h3\u003e\n\u003cdiv className=\"card-content\"\u003e\n\n**Standardized Integration**\n\nAgent ⟷ MCP ⟷ Slack/GitHub/...\n\nPlug \u0026 play, auto-auth\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003c/div\u003e\n\n---\n\n## Key Components\n\n\u003cdiv className=\"card-grid cols-2\"\u003e\n\n\u003cdiv className=\"study-card accent-orange\"\u003e\n\u003cdiv className=\"card-icon\"\u003e👥\u003c/div\u003e\n\u003ch3\u003eSubagents\u003c/h3\u003e\n\u003cdiv className=\"card-content\"\u003e\n\n| Benefit | Description |\n|:--:|:--|\n| ⚡ | Parallel task processing |\n| 📦 | Isolated context, return summary |\n\n\u003e Like junior researchers on a team\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cdiv className=\"study-card accent-teal\"\u003e\n\u003cdiv className=\"card-icon\"\u003e📝\u003c/div\u003e\n\u003ch3\u003eSkills System\u003c/h3\u003e\n\u003cdiv className=\"card-content\"\u003e\n\n| Essence | Folder-based instruction sets |\n|:--:|:--|\n| Mechanism | Progressive context disclosure |\n| Use Cases | Frontend design, doc generation |\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003c/div\u003e\n\n\u003cdiv className=\"card-grid cols-2\"\u003e\n\n\u003cdiv className=\"study-card accent-pink\"\u003e\n\u003cdiv className=\"card-icon\"\u003e🗜️\u003c/div\u003e\n\u003ch3\u003eCompaction\u003c/h3\u003e\n\u003cdiv className=\"card-content\"\u003e\n\n**Problem**: Long conversations exhaust context\n\n**Solution**: Auto-summarize history\n\nMonitor → Trigger → Summarize → Continue\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cdiv className=\"study-card accent-indigo\"\u003e\n\u003cdiv className=\"card-icon\"\u003e💻\u003c/div\u003e\n\u003ch3\u003eCode Generation\u003c/h3\u003e\n\u003cdiv className=\"card-content\"\u003e\n\n**Why is it core?**\n\n✅ Precise \u0026 predictable\n✅ Composable \u0026 reusable\n✅ Handles complex operations\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003c/div\u003e\n\n---\n\n## Security Model\n\n\u003cdiv className=\"study-card wide accent-red\"\u003e\n\u003cdiv className=\"card-icon\"\u003e🧀\u003c/div\u003e\n\u003ch3\u003eSwiss Cheese Defense\u003c/h3\u003e\n\u003cdiv className=\"card-content defense-layers\"\u003e\n\n```\nInput → [Model Alignment] → [Tool Permissions] → [Sandboxing] → Safe Output\n           Prevent evil       Parse \u0026 control      Limit impact\n```\n\n**Single layers may have holes, but stacked layers ensure security**\n\n\u003c/div\u003e\n\u003c/div\u003e\n\n\u003cdiv className=\"card-grid cols-3\"\u003e\n\n\u003cdiv className=\"study-card small accent-green\"\u003e\n\u003ch4\u003eRules Check\u003c/h4\u003e\n\u003cp\u003e⭐⭐⭐ Fast | Code/structured data\u003c/p\u003e\n\u003c/div\u003e\n\n\u003cdiv className=\"study-card small accent-yellow\"\u003e\n\u003ch4\u003eVisual Feedback\u003c/h4\u003e\n\u003cp\u003e⭐⭐ Medium | UI/formatting\u003c/p\u003e\n\u003c/div\u003e\n\n\u003cdiv className=\"study-card small accent-orange\"\u003e\n\u003ch4\u003eLLM as Judge\u003c/h4\u003e\n\u003cp\u003e⭐ Slow | Subjective quality\u003c/p\u003e\n\u003c/div\u003e\n\n\u003c/div\u003e\n\n---\n\n## Agent vs Workflow\n\n\u003cdiv className=\"comparison-table\"\u003e\n\n| | 🤖 Agent | 📋 Workflow |\n|:--|:--|:--|\n| **Input** | Ambiguous NL | Well-defined |\n| **Path** | Self-determined | Predefined |\n| **Best For** | Exploratory tasks | Process tasks |\n| **Example** | Claude Code | CI/CD |\n\n\u003c/div\u003e\n\n---\n\n## Term Quick Reference\n\n\u003cdiv className=\"term-grid\"\u003e\n\n| Term | One-line Definition |\n|:--|:--|\n| **Agentic Search** | Active file search via grep/tail |\n| **Hooks** | Runtime deterministic verification/injection |\n| **Compact** | Auto-summarize to prevent context exhaustion |\n| **Context Engineering** | Optimize performance via environment structure |\n| **Tools** | Atomic operation definitions |\n\n\u003c/div\u003e\n\n---\n\n## Self-Test Q\u0026A\n\n\u003cdetails\u003e\n\u003csummary\u003e❓ What's the SDK's core design principle?\u003c/summary\u003e\n\nGive agents computer access via terminal, using the same tools humans use.\n\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e❓ Why is Bash the most powerful?\u003c/summary\u003e\n\nGeneral + Composable + Store results + Dynamic scripts + Reuse existing software\n\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e❓ Two main benefits of subagents?\u003c/summary\u003e\n\n1. Parallelization\n2. Isolated context, return only key info\n\n\u003c/details\u003e\n\n\u003cdetails\u003e\n\u003csummary\u003e❓ How to choose verification methods?\u003c/summary\u003e\n\n- Code → Rules check (TypeScript/ESLint)\n- UI → Visual feedback (screenshots)\n- Subjective → LLM as judge (use carefully)\n\n\u003c/details\u003e\n\n---\n\n\u003cdiv className=\"checklist\"\u003e\n\n## Learning Progress\n\n- [ ] Three-stage agentic loop\n- [ ] Bash core advantages\n- [ ] Subagents \u0026 context management\n- [ ] MCP protocol role\n- [ ] Swiss Cheese Defense model\n- [ ] Verification method selection\n\n\u003c/div\u003e\n\n\u003c/div\u003e\n\n\u003cstyle\u003e{`\n.video-container {\n  margin: 1.5rem 0;\n  border-radius: 12px;\n  overflow: hidden;\n  box-shadow: 0 4px 20px rgba(0,0,0,0.15);\n}\n\n.video-container iframe {\n  display: block;\n}\n\n.sdk-cards {\n  --card-radius: 12px;\n  --accent-blue: #3b82f6;\n  --accent-purple: #8b5cf6;\n  --accent-green: #10b981;\n  --accent-orange: #f59e0b;\n  --accent-teal: #14b8a6;\n  --accent-pink: #ec4899;\n  --accent-indigo: #6366f1;\n  --accent-red: #ef4444;\n  --accent-yellow: #eab308;\n}\n\n.card-grid {\n  display: grid;\n  gap: 1rem;\n  margin: 1.5rem 0;\n}\n\n.card-grid.cols-2 {\n  grid-template-columns: repeat(2, 1fr);\n}\n\n.card-grid.cols-3 {\n  grid-template-columns: repeat(3, 1fr);\n}\n\n@media (max-width: 768px) {\n  .card-grid.cols-2,\n  .card-grid.cols-3 {\n    grid-template-columns: 1fr;\n  }\n}\n\n.study-card {\n  background: var(--card-bg, #f8fafc);\n  border-radius: var(--card-radius);\n  padding: 1.25rem;\n  border-left: 4px solid var(--accent, #3b82f6);\n  box-shadow: 0 2px 8px rgba(0,0,0,0.06);\n  transition: transform 0.2s, box-shadow 0.2s;\n}\n\n.study-card:hover {\n  transform: translateY(-2px);\n  box-shadow: 0 4px
